name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the main branch
  pull_request:
    branches:
      - main  # Trigger the workflow on pull requests to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run unit tests
      - name: Run unit tests
        run: npm run test -- --watch=false

      # Step 5: Run end-to-end (E2E) tests
      - name: Run E2E tests
        run: npm run e2e -- --watch=false

      # Step 6: Build Angular app
      - name: Build Angular application
        run: npm run build -- --prod

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Deploy job depends on successful build

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build Angular app
      - name: Build Angular application
        run: npm run build -- --prod

      # Step 5: Deploy to GitHub Pages (or another service)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: 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
          publish_dir: ./dist/Consommation-de-PigeonSkyRace  # Adjust based on the dist output directory
